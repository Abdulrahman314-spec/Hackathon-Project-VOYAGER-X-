<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10143b"><meta name="apple-mobile-web-app-title" content="Astro Commander"><meta name="application-name" content="Astro Commander">
<link rel="icon" type="image/svg+xml" href="assets/astro-commander-mark.svg"><link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
<title>Astro Commander</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#080b22;--panel:#121739;--line:#2c3675;--tx:#e9edff;--mut:#9aa5d8;--amb:#ffb347;--teal:#4de3c1;--rose:#ff6b8b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-user-select:none!important;user-select:none!important;-webkit-tap-highlight-color:transparent}
::selection{background:transparent;color:inherit}::-moz-selection{background:transparent;color:inherit}
html,body{height:100%;margin:0;background:var(--ink);color:var(--tx);font-family:Cairo,system-ui,sans-serif;overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:0}
.scr{position:fixed;inset:0;z-index:2;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;overflow:auto;text-align:center}
.scr.on{display:flex}
h1{font:400 clamp(20px,5.2vw,48px)/1.3 'Press Start 2P',monospace;color:var(--amb);text-shadow:4px 4px 0 #b3362f,8px 8px 0 #1b1f55;margin:0;direction:ltr}
h2{font-size:clamp(18px,3vw,26px);margin:0;font-weight:900}
.sub{color:var(--mut);margin:0}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:980px}
.card{background:var(--panel);border:0;color:var(--tx);font-family:inherit;padding:10px;cursor:pointer;box-shadow:0 0 0 2px var(--line),4px 4px 0 2px #000;display:flex;flex-direction:column;align-items:center;gap:6px;width:138px;transition:transform .12s}
.card:hover{transform:translateY(-3px)}
.card.sel{box-shadow:0 0 0 3px var(--amb),4px 4px 0 3px #000;background:#1b2150}
.card canvas{image-rendering:pixelated}
.card b{font-size:15px}.card small{color:var(--mut);font-size:12px;line-height:1.4}
.btn{font:900 17px Cairo,sans-serif;background:var(--amb);color:#1b1230;border:0;padding:12px 30px;cursor:pointer;box-shadow:0 0 0 2px #000,4px 4px 0 2px #b3362f}
.btn:active{transform:translate(2px,2px)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--panel);color:var(--tx);box-shadow:0 0 0 2px var(--line),4px 4px 0 2px #000}
input{font:700 18px Cairo,sans-serif;background:#0b0f2c;color:var(--tx);border:0;padding:10px 14px;width:240px;text-align:center;box-shadow:0 0 0 2px var(--line);outline:0}
input:focus,.btn:focus-visible,.card:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
#gm{position:fixed;inset:0;z-index:1;display:none;background:#000}#gm.on{display:block}
#hud{position:fixed;inset:0;z-index:5;pointer-events:none;display:none}#hud.on{display:block}
#hud>*{pointer-events:auto}
.tag{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;background:#0a0e2acc;padding:8px 12px;box-shadow:0 0 0 2px var(--line);font-weight:700;display:flex;gap:10px;align-items:center}
.tag span{color:var(--mut);font-weight:400}
#chips{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;display:flex;gap:6px}
.chip{background:#0a0e2acc;padding:6px 8px;font-size:12px;box-shadow:0 0 0 2px var(--line);color:var(--mut)}
.chip.ok{color:#0b2a22;background:var(--teal);box-shadow:0 0 0 2px #0b2a22}
#mc{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 200px));background:#0a0e2aee;padding:10px 14px;box-shadow:0 0 0 2px var(--teal),4px 4px 0 2px #000;display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.6}
#mc i{font-style:normal;color:var(--teal);font-weight:900;white-space:nowrap}
#mc button,#mcShow{background:none;border:0;color:var(--mut);cursor:pointer;font:inherit;font-size:12px}
#mcShow{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#0a0e2aee;color:var(--teal);padding:8px 14px;box-shadow:0 0 0 2px var(--teal);display:none}
#dp{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:12px;display:grid;grid-template:repeat(3,44px)/repeat(3,44px);gap:3px;direction:ltr}
#dp button{background:#0a0e2acc;border:0;color:var(--tx);font-size:18px;box-shadow:0 0 0 2px var(--line);touch-action:none}
#act{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));right:12px;display:none}
#skip{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));right:12px;display:none}
#cd{position:absolute;top:40%;left:0;right:0;text-align:center;font:400 clamp(40px,10vw,90px) 'Press Start 2P',monospace;color:var(--amb);text-shadow:5px 5px 0 #b3362f;display:none}
#ph{position:absolute;top:calc(60px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-weight:900;color:var(--teal);text-shadow:2px 2px 0 #000;display:none}
#pn{position:fixed;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,92vw);background:var(--panel);box-shadow:0 0 0 3px var(--amb),6px 6px 0 3px #000;padding:18px;text-align:center;display:none;flex-direction:column;gap:10px}
#pn.on{display:flex}#pn h3{margin:0;font-size:22px}
.bar{height:12px;background:#0b0f2c;box-shadow:0 0 0 2px var(--line)}.bar i{display:block;height:100%;width:0;background:var(--teal)}
.big{font:900 28px Cairo;color:var(--amb)}
.rw{display:grid;grid-template-columns:90px 1fr 44px;gap:8px;align-items:center;font-size:13px;text-align:right}
.rw .bar{height:10px}.rw .bar i{background:var(--rose)}
#end{background:#050718e6;z-index:7}
@media(max-width:640px){#mc{width:calc(100% - 24px);bottom:calc(66px + env(safe-area-inset-bottom,0px))}#dp{bottom:calc(14px + env(safe-area-inset-bottom,0px))}.chip{font-size:10px;padding:4px 6px}.card{width:112px}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
html,body{height:100dvh}
.scr{justify-content:flex-start}.scr>:first-child{margin-top:auto}.scr>:last-child{margin-bottom:auto}
.scr,#hud,#dp{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#fs{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:20;background:#0a0e2acc;color:var(--tx);border:0;font:700 13px Cairo,sans-serif;padding:6px 12px;cursor:pointer;box-shadow:0 0 0 2px var(--line)}
#toast{position:fixed;z-index:30;left:50%;bottom:90px;transform:translateX(-50%);background:var(--panel);box-shadow:0 0 0 2px var(--amb);padding:10px 16px;max-width:90vw;display:none;font-size:14px}
#rot{display:none;position:fixed;z-index:25;top:calc(48px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--amb);color:#1b1230;font-weight:800;font-size:13px;padding:6px 12px;pointer-events:none}
@media(orientation:portrait) and (max-width:700px){#hud.on~#rot{display:block}}
.chip{display:flex;gap:4px;align-items:center}.chip canvas{width:16px;height:16px;image-rendering:pixelated}
@media(max-width:640px){#chips{top:calc(52px + env(safe-area-inset-top,0px));flex-wrap:wrap;max-width:60%}}
input{-webkit-user-select:none!important;user-select:none!important}
.gauge{position:relative;height:28px;background:#0b0f2c;box-shadow:0 0 0 2px var(--line);margin:8px 0}.gauge i{position:absolute;top:0;bottom:0;background:#2aa86b88;box-shadow:inset 0 0 0 2px #2aa86b}.gauge b{position:absolute;top:-5px;bottom:-5px;width:6px;margin-left:-3px;background:var(--amb)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.tl{height:44px;border:0;padding:0;overflow:hidden;cursor:pointer;background:#6b4a30;box-shadow:inset -3px -3px 0 #0006,inset 3px 3px 0 #fff3;touch-action:manipulation;font:700 10px Cairo;color:var(--tx)}.tl.o{background:#1d2150!important;box-shadow:none;color:var(--teal)}.tl.f{background:#1d2150!important;box-shadow:0 0 0 2px var(--amb);color:var(--amb)}
.arena{position:relative;height:200px;background:#0b0f2c;box-shadow:0 0 0 2px var(--line);overflow:hidden;touch-action:none}
.bb{position:absolute;left:0;top:0;width:64px;height:64px;border-radius:50%;border:0;font:700 12px Cairo;color:#fff;cursor:pointer;touch-action:none}.bb.g{background:#1f9d6b;box-shadow:0 0 0 3px #4de3c1}.bb.r{background:#8a3a4a;box-shadow:0 0 0 3px #ff6b8b}
.shake{animation:sh .25s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#pn{max-height:92dvh;overflow:auto;-webkit-overflow-scrolling:touch}#pn .btn{touch-action:manipulation}
#gm{touch-action:none}
#dp{display:block;width:132px;height:132px;grid-template:none;border-radius:50%;background:#0a0e2a99;box-shadow:0 0 0 2px var(--line);touch-action:none}
#nub{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:var(--amb);opacity:.85;pointer-events:none}
@media (hover:hover) and (pointer:fine){#dp{display:none!important}}
@media(max-height:500px){#mc{width:calc(100% - 340px);font-size:12px;padding:6px 10px;bottom:calc(8px + env(safe-area-inset-bottom,0px))}.card{width:104px}#dp{width:112px;height:112px}}
.spc{position:relative;height:26px;background:#05070f;box-shadow:0 0 0 2px var(--line);margin:6px 0}.spc i{position:absolute;top:0;bottom:0;width:3px;background:#4de3c1}
.tgt{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:#b58cff;box-shadow:0 0 0 3px #fff}.xh{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;box-shadow:0 0 0 2px var(--teal);pointer-events:none}
#s0{direction:ltr;justify-content:flex-start;gap:8px}
.logo{margin:3vh 0 0;text-align:center;font:400 clamp(24px,7.4vw,74px)/1.12 'Press Start 2P',monospace;transform:rotate(-3deg)}
.logo-mark{display:block;width:clamp(64px,14vw,116px);height:clamp(64px,14vw,116px);margin:0 auto 8px;image-rendering:pixelated;filter:drop-shadow(0 8px 0 #090c2a)}
.logo span{display:block}
.logo .a{color:#fff;text-shadow:3px 0 #1c1c7a,-3px 0 #1c1c7a,0 3px #1c1c7a,0 -3px #1c1c7a,3px 3px #1c1c7a,-3px -3px #1c1c7a,3px -3px #1c1c7a,-3px 3px #1c1c7a,0 8px #0d0d40}
.logo .b{color:#5fe3ff;text-shadow:3px 0 #12306b,-3px 0 #12306b,0 3px #12306b,0 -3px #12306b,3px 3px #12306b,-3px -3px #12306b,3px -3px #12306b,-3px 3px #12306b,0 8px #08183a}
.tag2{font:800 clamp(13px,2.4vw,22px) Cairo;color:#fff;text-shadow:2px 2px 0 #0b0b40;margin:0}.tag2 b{color:var(--amb)}
.tbs{display:flex;flex-direction:column;gap:12px;align-self:flex-end;margin:auto 6vw auto 0}
.tb{display:flex;align-items:center;gap:14px;width:min(300px,78vw);min-height:52px;padding:8px 18px;font:800 clamp(16px,3vw,22px) Cairo;color:#fff;border:0;cursor:pointer;text-align:left;border-radius:10px}
.tb canvas{width:30px;height:30px;image-rendering:pixelated}
.tb.p{background:#7b4fd6;box-shadow:inset 0 3px 0 #a98bff,inset 0 -4px 0 #4a2aa0,0 0 0 3px #1a1050}
.tb.b{background:#2f7de0;box-shadow:inset 0 3px 0 #6aa8ff,inset 0 -4px 0 #1b4fa8,0 0 0 3px #0e1a50}
.tb.g{background:#35b84a;box-shadow:inset 0 3px 0 #7be08a,inset 0 -4px 0 #1f7a2e,0 0 0 3px #0e3a1a}
.tb:active{transform:translateY(2px)}.tb:focus-visible{outline:3px solid #fff;outline-offset:3px}.tb:disabled{opacity:.55;filter:saturate(.5);cursor:not-allowed}
@media(max-width:700px){.tbs{align-self:center;margin:auto}}
.sr{display:flex;justify-content:space-between;align-items:center;gap:12px;width:min(440px,92vw);background:var(--panel);padding:10px 14px;box-shadow:0 0 0 2px var(--line)}
.seg{display:flex;gap:4px}.seg button{border:0;background:#0b0f2c;color:var(--mut);font:700 14px Cairo;padding:8px 12px;cursor:pointer;min-height:42px}.seg button.on{background:var(--amb);color:#1b1230}
#mm{position:absolute;top:calc(52px + env(safe-area-inset-top,0px));right:10px;width:120px;height:80px;image-rendering:pixelated;box-shadow:0 0 0 2px var(--line);display:none}
#btns{position:absolute;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#act,#skip{position:static!important}#rad,#jmp{display:none;min-height:46px;padding:10px 18px}
@media(pointer:coarse){.btn,.card{min-height:48px}#btns .btn{min-height:52px}}
#mca{width:48px;height:48px;image-rendering:pixelated;flex:none}#mct{min-height:42px}#mcb{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}#mcb button{background:#161c4a;color:var(--tx);padding:5px 9px;font-size:12px;min-height:30px;cursor:pointer}
#cmp{position:absolute;top:calc(138px + env(safe-area-inset-top,0px));right:10px;width:120px;text-align:center;font-size:12px;background:#0a0e2acc;padding:4px;box-shadow:0 0 0 2px var(--line);display:none}#ca{display:inline-block;color:var(--amb);font-size:18px}
#rov{display:none;min-height:46px;padding:10px 18px}
@media(max-height:500px){#mca{display:none}#cmp{top:calc(138px + env(safe-area-inset-top,0px))}}
#cut{position:fixed;inset:0;z-index:40;pointer-events:none;display:none;--c:#ff5a3a}
#cut.on{display:block;animation:cutv .8s forwards}@keyframes cutv{from{box-shadow:inset 0 0 0 var(--c)}to{box-shadow:inset 0 0 22vw var(--c)}}
#cut i{position:absolute;left:0;right:0;height:0;background:#000;transition:height .5s}#cut .bt{top:0}#cut .bb{bottom:0}#cut.on i{height:15vh}
#cutc{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;padding:0 16px}
#cuti{font-size:clamp(40px,10vw,90px);animation:pop .6s}#cutt{margin:6px 0;font:900 clamp(22px,5.5vw,50px) Cairo,sans-serif;color:var(--c);text-shadow:3px 3px 0 #000;animation:pop .6s}#cuts{margin:0;font-weight:700;font-size:clamp(14px,2.6vw,22px);color:#fff;text-shadow:2px 2px 0 #000}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
#evb{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:12;background:#8a1d2e;color:#fff;font-weight:900;padding:6px 14px;box-shadow:0 0 0 2px #ff6b8b;display:none;animation:bl 1s infinite}@keyframes bl{50%{background:#c0283f}}
#pn.ev{box-shadow:0 0 0 3px #ff6b8b,6px 6px 0 3px #000}
@media(prefers-reduced-motion:reduce){#cut.on{animation:none}#evb{animation:none}}

/* ---------- NASA mission layer: additive, preserves the original game ---------- */
#missionBtn{background:#0a0e2acc;color:var(--teal);border:0;font:700 12px Cairo;padding:6px 9px;cursor:pointer;box-shadow:0 0 0 2px var(--line)}
#missionPanel{font-size:14px;line-height:1.65;text-align:right}#missionPanel h3{margin:0;color:var(--amb)}
.mstat{display:grid;grid-template-columns:76px 1fr 38px;gap:7px;align-items:center;margin:5px 0}.mstat .bar{height:10px}.mstat i{display:block;height:100%;background:var(--teal);width:0}.mstat:nth-of-type(3) i{background:#7eb8ff}.mstat:nth-of-type(4) i{background:var(--amb)}
.mevent{border:1px solid var(--line);background:#0b0f2c;padding:9px;margin:8px 0;text-align:right}.mnote{font-size:12px;color:var(--mut);line-height:1.5}.mchoices{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.mchoices button{flex:1 1 120px;min-height:54px;padding:7px;background:#161c4a;color:var(--tx);border:0;box-shadow:0 0 0 2px var(--line);cursor:pointer;font:700 12px Cairo}.mchoices button:hover{box-shadow:0 0 0 2px var(--teal)}
.msource{font-size:11px;color:var(--mut);border-top:1px solid var(--line);padding-top:7px;margin-top:8px}.live{color:var(--teal)}.stored{color:var(--amb)}

#langBtn{position:fixed;top:calc(50px + env(safe-area-inset-top,0px));left:10px;z-index:21;background:#0a0e2acc;color:var(--tx);border:0;font:700 12px Cairo;padding:6px 10px;cursor:pointer;box-shadow:0 0 0 2px var(--line)}
#spaceAlert{position:fixed;top:calc(0px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:35;display:none;width:min(760px,94vw);background:#9f1d2d;color:#fff;border:2px solid #ff6b8b;box-shadow:0 0 18px #ff385577;padding:8px 14px;text-align:center;font-weight:900;animation:alertpulse 1s infinite}
#spaceAlert.on{display:block}@keyframes alertpulse{50%{background:#d3263f}}
.mtimer{font-size:18px;color:var(--amb);font-weight:900;margin:8px 0}.mcritical{color:#ff6b8b;font-weight:900}.missionRtl{text-align:right}.missionLtr{text-align:left;direction:ltr}

/* Responsive mission panel and HUD safety rules */
#missionPanel{width:100%;min-width:0;overflow-wrap:anywhere}#missionPanel .mchoices{width:100%}#missionPanel .mchoices button{min-width:0;word-break:normal}#pn{width:min(560px,calc(100vw - 24px));padding:clamp(12px,2vw,20px)}
@media (max-width:900px){#mc{width:min(560px,calc(100% - 180px))}#tg{max-width:42vw;font-size:13px}.tag{padding:6px 8px}.mchoices button{font-size:13px}}
@media (max-width:640px){#pn{max-height:88dvh}#missionPanel{font-size:13px}.mchoices{gap:8px}.mchoices button{flex:1 1 46%;min-height:58px;padding:8px 5px}.mevent{margin:7px 0;padding:8px}.mstat{grid-template-columns:62px 1fr 32px;font-size:12px}.mnote{font-size:11px}#spaceAlert{font-size:12px;padding:6px 8px}#langBtn{top:calc(48px + env(safe-area-inset-top,0px));left:8px}.tag{right:8px;top:calc(44px + env(safe-area-inset-top,0px));max-width:55vw}.tag span{display:block}.scr{padding:12px}.row{max-width:100%;gap:8px}.btn{padding:10px 16px;font-size:15px}.tb{width:min(320px,90vw)}}
@media (max-width:380px){#missionPanel .mchoices button{flex-basis:100%}.mstat{grid-template-columns:55px 1fr 28px}.mstat .bar{height:9px}#chips{max-width:72%}.chip{max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
@media (min-width:1200px){#pn{width:600px}#missionPanel{font-size:15px}.mchoices button{min-height:62px}.tag{font-size:15px}}
@media (orientation:landscape) and (max-height:560px){#pn{max-height:84dvh;padding:10px}#missionPanel h3{font-size:18px}.mchoices button{min-height:44px}.mnote{font-size:11px}#mc{bottom:8px}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<button id="fs">ملء الشاشة</button><button id="langBtn" type="button">English</button><div id="spaceAlert" role="alert"></div><div id="toast"></div><div id="cut"><i class="bt"></i><i class="bb"></i><div id="cutc"><div id="cuti"></div><h2 id="cutt"></h2><p id="cuts"></p></div></div><div id="evb"></div>
<div id="gm"></div>

<section class="scr on" id="s0">
  <h1 class="logo"><img class="logo-mark" src="assets/astro-commander-mark.svg" alt=""><span class="a">ASTRO</span><span class="b">COMMANDER</span></h1>
  <p class="tag2">Explore • Learn • <b>Discover</b></p>
  <div class="tbs"><button class="tb p" id="continueGame"><canvas id="i1" width="24" height="24"></canvas>Continue Game</button><button class="tb b" id="newGame"><canvas id="i2" width="24" height="24"></canvas>New Game</button><button class="tb g" id="bset"><canvas id="i3" width="24" height="24"></canvas>Settings</button><button class="tb b" id="bq">Quit</button></div>
</section>
<section class="scr" id="set"><h2>Settings</h2><div id="setb" style="display:flex;flex-direction:column;gap:8px"></div><button class="btn" id="setx">رجوع</button></section>
<section class="scr" id="quit"><h2>See you soon, Commander!</h2><p class="sub">شكرًا إنك لعبت Astro Commander. الفضاء مستنيك.</p><button class="btn" id="qb">رجوع</button></section>
<section class="scr" id="s1">
